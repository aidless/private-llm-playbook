[project]
name = "private-llm-playbook"
version = "0.1.0"
description = "小模型私有化部署 playbook：硬件矩阵、部署步骤、验收指标、成本账，全部引用实测资产"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
playbook-check = "privatellm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
